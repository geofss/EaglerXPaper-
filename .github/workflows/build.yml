name: Build EaglerXPaper

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/bukkit-player-join-confirmation-timeout]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build EaglerXPaper Bukkit plugin
        run: ./gradlew :core:shadowJarBukkit --no-daemon
      - name: Upload Bukkit plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EaglerXPaper-test-build
          path: core/build/libs/EaglerXPaper.jar
          if-no-files-found: error
          retention-days: 7
