name: Build EaglerXPaper

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/bukkit-player-join-confirmation-timeout]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build EaglerXPaper Bukkit plugin
        run: ./gradlew :core:shadowJarBukkit --no-daemon
